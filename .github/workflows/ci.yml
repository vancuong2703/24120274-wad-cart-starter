name: CI Quality Gate

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  gate:
    name: Test & Format Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verification gate (npm test + prettier check)
        run: npm run gate
